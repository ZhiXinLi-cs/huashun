# ============================================================
# Banner 指纹识别规则（与程序代码解耦）
# - 规则按 priority 从高到低匹配，首个命中即停
# - patterns 为多条正则，任一命中即该规则命中
# - 正则第 1 个捕获组作为 version（无捕获组则 version 为空）
# - 命中规则后，再用 os_hints 扫描 banner 填充 os_hint
# 注意：正则一律用单引号包裹，YAML 单引号内 \d \s \b \x 等保持原义、不做转义
# ============================================================

# ---- 全局操作系统特征（命中后填充 os_hint 字段）----
os_hints:
  - {regex: '(?i)ubuntu',   os: Ubuntu}
  - {regex: '(?i)debian',   os: Debian}
  - {regex: '(?i)centos',   os: CentOS}
  - {regex: '(?i)red\s?hat', os: RedHat}
  - {regex: '(?i)windows',  os: Windows}
  - {regex: '(?i)freebsd',  os: FreeBSD}
  - {regex: '(?i)\bdarwin\b', os: macOS}

# ---- 协议 / 软件识别规则 ----
rules:
  # ========== SSH ==========
  - id: ssh-openssh
    protocol: SSH
    product: OpenSSH
    priority: 100
    confidence: 0.95
    patterns:
      - '^SSH-\d+\.\d+-OpenSSH[_-]([^\s]+)'   # 兼容 SSH-2.0 与 SSH-1.99 前缀
  - id: ssh-dropbear
    protocol: SSH
    product: Dropbear
    priority: 100
    confidence: 0.9
    patterns:
      - '^SSH-\d+\.\d+-dropbear_([^\s]+)'

  # ========== HTTP ==========
  - id: http-nginx
    protocol: HTTP
    product: nginx
    priority: 90
    confidence: 0.9
    patterns:
      - '(?i)server:\s*nginx/([^\s]+)'          # 如 Server: nginx/1.24.0
      - '(?i)\bnginx/([^\s]+)'
      - '(?i)\bnginx\b'
  - id: http-apache
    protocol: HTTP
    product: Apache
    priority: 90
    confidence: 0.9
    patterns:
      - '(?i)server:\s*apache/([^\s]+)'         # 如 Server: Apache/2.4.57
      - '(?i)\bapache/([^\s]+)'
      - '(?i)\bapache\b'
  - id: http-jetty
    protocol: HTTP
    product: Jetty
    priority: 90
    confidence: 0.85
    patterns:
      - '(?i)jetty\(([^\s)]+)'                  # 如 Server: Jetty(9.4.50.v20221201)
      - '(?i)jetty/([^\s]+)'                    # 如 Server: Jetty/9.4.51
      - '(?i)\bjetty\b'

  # ========== MySQL ==========
  - id: mysql
    protocol: MySQL
    product: MySQL
    priority: 80
    confidence: 0.9
    patterns:
      - '^(\d+\.\d+\.\d+)'                      # 纯版本号开头的 banner
      - '\x0a(\d+\.\d+\.\d+)'                   # 握手报文：报文头后 \n 紧跟版本号（如 J\x00\x00\x00\n8.0.32\x00）
      - '(?i)mysql'                             # 关键词兜底

  # ========== Redis（按信号强弱分档置信度）==========
  - id: redis-version
    protocol: Redis
    product: Redis
    priority: 80
    confidence: 0.9
    patterns:
      - 'redis_version:([^\s]+)'                # INFO 输出，最强信号
  - id: redis-pong
    protocol: Redis
    product: Redis
    priority: 79
    confidence: 0.8
    patterns:
      - '(?i)^\+PONG'
  - id: redis-noauth
    protocol: Redis
    product: Redis
    priority: 79
    confidence: 0.7
    patterns:
      - '(?i)^-NOAUTH'
  - id: redis-err
    protocol: Redis
    product: Redis
    priority: 79
    confidence: 0.7
    patterns:
      - '(?i)^-ERR'                             # RESP 错误响应（无版本号）
  - id: redis-keyword
    protocol: Redis
    product: Redis
    priority: 78
    confidence: 0.7
    patterns:
      - '(?i)\bredis\b'

  # ========== FTP ==========
  - id: ftp-vsftpd
    protocol: FTP
    product: vsFTPd
    priority: 70
    confidence: 0.9
    patterns:
      - '(?i)vsftpd\s+([^\s)]+)'                # 如 220 (vsFTPd 3.0.5)
      - '(?i)vsftpd'
  - id: ftp-proftpd
    protocol: FTP
    product: ProFTPD
    priority: 70
    confidence: 0.9
    patterns:
      - '(?i)proftpd\s+([^\s]+)'                # 如 220 ProFTPD 1.3.7 Server (ProFTPD)
      - '(?i)proftpd'
  - id: ftp-pureftpd
    protocol: FTP
    product: Pure-FTPd
    priority: 70
    confidence: 0.85
    patterns:
      - '(?i)pure-ftpd'
  - id: ftp-microsoft
    protocol: FTP
    product: Microsoft FTP
    priority: 70
    confidence: 0.8
    patterns:
      - '(?i)microsoft ftp'
